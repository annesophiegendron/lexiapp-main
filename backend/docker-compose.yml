services:
  postgres:
    image: postgres:16
    container_name: lexiapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexiapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  postgres_data:
