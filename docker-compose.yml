services:
  postgres:
    image: postgres:16
    container_name: lexiapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lexiapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lexiapp"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: lexiapp-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama --version >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  ollama_pull:
    image: ollama/ollama:latest
    container_name: lexiapp-ollama-pull
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-lc"]
    command: "until ollama ps >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-llama3}"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lexiapp-backend
    depends_on:
      postgres:
        condition: service_healthy
      ollama_pull:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lexiapp
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3
      WHISPER_MODEL: base
      SEED_DEMO_DATA: "true"
      AUDIO_STORAGE_DIR: /app/backend/stockage/audios
      STORAGE_BACKEND: local
    ports:
      - "8000:8000"
    volumes:
      - ./backend/stockage/audios:/app/backend/stockage/audios

volumes:
  postgres_data:
  ollama_data:
